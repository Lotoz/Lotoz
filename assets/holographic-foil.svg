<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Zamira Grippi, Lotoz: cybersecurity, Blue Team, Linux">
  <defs>
    <!-- Iridescent foil — animated stop offsets -->
    <linearGradient id="hf-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#fbbf24;#ef4444;#c084fc;#f59e0b;#a78bfa" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.25" stop-color="#fbbf24">
        <animate attributeName="stop-color" values="#fbbf24;#ef4444;#c084fc;#f59e0b;#a78bfa;#fbbf24" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ef4444">
        <animate attributeName="stop-color" values="#ef4444;#c084fc;#f59e0b;#a78bfa;#fbbf24;#ef4444" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.75" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f59e0b;#a78bfa;#fbbf24;#ef4444;#c084fc" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#a78bfa;#fbbf24;#ef4444;#c084fc;#f59e0b" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Diagonal sheen — sweeps across the card -->
    <linearGradient id="hf-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Orbiting radial highlight -->
    <radialGradient id="hf-orb" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="cx" values="0.25;0.75;0.6;0.3;0.25" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0.3;0.65;0.3;0.7;0.3" dur="9s" repeatCount="indefinite"/>
    </radialGradient>

    <!-- Foil scale pattern (Pokémon-card crystal scales) -->
    <pattern id="hf-scales" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0,18 Q9,4 18,18 Q27,32 36,18 Q27,4 18,18 Q9,32 0,18" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.18"/>
      <circle cx="18" cy="18" r="0.6" fill="#ffffff" opacity="0.25"/>
    </pattern>

    <!-- Card clip -->
    <clipPath id="hf-clip">
      <rect x="72" y="36" width="1056" height="348" rx="22"/>
    </clipPath>

    <!-- Edition glow -->
    <filter id="hf-glow">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>

    <!-- Card outer drop -->
    <filter id="hf-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stage backdrop -->
  <rect width="1200" height="420" fill="#100b18"/>
  <rect width="1200" height="420" fill="url(#hf-foil)" opacity="0.08"/>

  <!-- Card frame -->
  <g filter="url(#hf-drop)">
    <rect x="72" y="36" width="1056" height="348" rx="22" fill="#160e20"/>
    <rect x="72" y="36" width="1056" height="348" rx="22" fill="none" stroke="url(#hf-foil)" stroke-width="2"/>
  </g>

  <!-- Card interior (clipped) -->
  <g clip-path="url(#hf-clip)">
    <!-- Iridescent base wash -->
    <rect x="72" y="36" width="1056" height="348" fill="url(#hf-foil)" opacity="0.32"/>
    <!-- Scales -->
    <rect x="72" y="36" width="1056" height="348" fill="url(#hf-scales)"/>
    <!-- Vignette -->
    <radialGradient id="hf-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.5" stop-color="#160e20" stop-opacity="0"/>
      <stop offset="1" stop-color="#160e20" stop-opacity="0.7"/>
    </radialGradient>
    <rect x="72" y="36" width="1056" height="348" fill="url(#hf-vignette)"/>
    <!-- Orbiting highlight -->
    <rect x="72" y="36" width="1056" height="348" fill="url(#hf-orb)"/>

    <!-- Diagonal sheen — skewed and translated horizontally -->
    <g transform="skewX(-22)">
      <rect x="-300" y="-40" width="180" height="600" fill="url(#hf-sheen)">
        <animate attributeName="x" values="-300;1300;-300" dur="6s" repeatCount="indefinite" keyTimes="0;0.7;1"/>
      </rect>
    </g>
  </g>

  <!-- TOP STRIP — name + profile level -->
  <g font-family="'Space Grotesk', 'Neue Haas Grotesk', system-ui, sans-serif">
    <text x="112" y="94" font-size="40" font-weight="800" fill="#fef3c7" letter-spacing="-1">ZAMIRA GRIPPI · LOTOZ</text>
    <text x="112" y="118" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24" letter-spacing="4">CYBERSECURITY · BLUE TEAM · LINUX</text>
  </g>
  <g transform="translate(1012,84)" font-family="'JetBrains Mono', monospace" text-anchor="end">
    <text x="0" y="0" font-size="11" fill="#fbbf24" letter-spacing="3">LV</text>
    <text x="0" y="32" font-size="36" font-weight="700" fill="#fef3c7">01</text>
  </g>

  <!-- DIVIDER -->
  <rect x="112" y="133" width="976" height="0.8" fill="url(#hf-foil)" opacity="0.7"/>

  <!-- PORTRAIT FRAME — abstract iridescent panel -->
  <g transform="translate(112,150)">
    <rect width="340" height="190" rx="8" fill="#0d0814"/>
    <rect width="340" height="190" rx="8" fill="url(#hf-foil)" opacity="0.55"/>
    <rect width="340" height="190" rx="8" fill="url(#hf-scales)"/>
    <!-- Geometric monogram -->
    <g transform="translate(170,96)" font-family="'Bodoni Moda', 'Playfair Display', serif" text-anchor="middle">
      <text y="22" font-size="120" font-weight="700" font-style="italic" fill="#fef3c7">ZG</text>
      <line x1="-46" y1="36" x2="46" y2="36" stroke="#fef3c7" stroke-width="1.4"/>
    </g>
    <rect width="340" height="190" rx="8" fill="none" stroke="url(#hf-foil)" stroke-width="1"/>
  </g>

  <!-- SECURITY FOCUS (right column) -->
  <g transform="translate(492,156)" font-family="'Space Grotesk', system-ui, sans-serif">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" letter-spacing="4">— BLUE TEAM FOCUS</text>
    <g transform="translate(0,28)">
      <text font-size="17" font-weight="600" fill="#fef3c7">◆ System Hardening</text>
      <text x="596" font-size="12" fill="#fbbf24" text-anchor="end">LINUX</text>
      <text x="0" y="20" font-size="11" fill="#cbd5e1" opacity="0.8">Linux baselines · secure configuration</text>
    </g>
    <g transform="translate(0,76)">
      <text font-size="17" font-weight="600" fill="#fef3c7">◈ Digital Forensics</text>
      <text x="596" font-size="12" fill="#ef4444" text-anchor="end">CAINE</text>
      <text x="0" y="20" font-size="11" fill="#cbd5e1" opacity="0.8">Evidence handling · forensic analysis</text>
    </g>
    <g transform="translate(0,124)">
      <text font-size="17" font-weight="600" fill="#fef3c7">✦ Security Auditing</text>
      <text x="596" font-size="12" fill="#c084fc" text-anchor="end">NMAP</text>
      <text x="0" y="20" font-size="11" fill="#cbd5e1" opacity="0.8">Wireshark · Burp Suite · OWASP ZAP</text>
    </g>
  </g>

  <!-- BOTTOM FOOTER STRIP -->
  <rect x="112" y="341" width="976" height="0.8" fill="url(#hf-foil)" opacity="0.7"/>
  <g font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="3">
    <text x="112" y="362" fill="#cbd5e1">LOTOZ · CYBERSECURITY PROFILE</text>
    <text x="1088" y="362" text-anchor="end" fill="#fbbf24">BLUE TEAM · LINUX</text>
  </g>

  <!-- Edition stamp -->
  <g transform="translate(1066,86)" filter="url(#hf-glow)">
    <circle r="22" fill="none" stroke="#ef4444" stroke-width="1"/>
    <text text-anchor="middle" y="-3" font-family="'JetBrains Mono', monospace" font-size="7" fill="#fbbf24" letter-spacing="2">BLUE</text>
    <text text-anchor="middle" y="9" font-family="'JetBrains Mono', monospace" font-size="7" fill="#fbbf24" letter-spacing="2">TEAM</text>
  </g>
</svg>